<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCODS '25 Jersey Picker</title>
<style>
:root {
--bg: #121212;
--card-bg: #1e1e1e;
--input-bg: #2a2a2a;
--border: #333333;
--text: #f3f4f6;
--muted: #9ca3af;
--blue: #3b82f6;
--blue-hover: #2563eb;
--green: #10b981;
--red: #ef4444;
}
* { box-sizing: border-box; }
body {
margin: 0; background: var(--bg);
font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
color: var(--text);
}
.wrap { max-width: 480px; margin: 0 auto; padding: 16px 12px 40px; }
header { margin-bottom: 16px; }
h1 { font-size: 20px; margin: 0 0 4px; font-weight: 700; }
header p { margin: 0; color: var(--muted); font-size: 13px; }
​.tabs { display: flex; gap: 8px; margin: 14px 0; background: var(--card-bg); padding: 4px; border-radius: 12px; border: 1px solid var(--border); }
.tab { flex: 1; border: 0; background: transparent; padding: 10px; border-radius: 8px; font-weight: 600; color: var(--muted); cursor: pointer; text-align: center; font-size: 14px; }
.tab.active { background: var(--blue); color: white; }
​.card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin: 12px 0; }
h2 { font-size: 16px; margin: 0 0 10px; font-weight: 600; }
​label { display: block; font-weight: 600; font-size: 12px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; }
input {
width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px;
background: var(--input-bg); font: inherit; color: var(--text); outline: none;
}
input:focus { border-color: var(--blue); }
.field { margin-bottom: 14px; }
​.btn {
background: var(--blue); color: white; border: 0; border-radius: 10px;
padding: 13px 16px; font-weight: 600; font-size: 14px; cursor: pointer; width: 100%;
text-align: center; margin-top: 6px;
}
.btn:hover { background: var(--blue-hover); }
.btn.danger { background: rgba(239, 68, 68, 0.15); color: var(--red); width: auto; padding: 6px 12px; font-size: 12px; }
​.jersey-preview {
background: linear-gradient(145deg, #18181b, #09090b);
border: 1px solid var(--border); border-radius: 12px; padding: 16px; text-align: center; margin-bottom: 16px;
}
.jersey-svg-wrap { width: 130px; margin: 0 auto 8px; }
.jersey-svg-wrap svg { width: 100%; height: auto; display: block; }
.preview-name { font-size: 12px; font-weight: 700; letter-spacing: 1.5px; color: white; text-transform: uppercase; margin-bottom: 2px; }
.preview-num { font-size: 32px; font-weight: 900; color: white; line-height: 1; }
​.size-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.size-pill {
background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px;
padding: 10px 0; text-align: center; font-weight: 600; font-size: 13px; cursor: pointer; color: var(--text);
}
.size-pill.selected { background: var(--blue); border-color: var(--blue); color: white; }
​.cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.cat-btn {
background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px;
padding: 10px; text-align: center; font-weight: 600; cursor: pointer; color: var(--muted);
}
.cat-btn.selected { background: var(--blue); border-color: var(--blue); color: white; }
​.numbers { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; max-height: 280px; overflow-y: auto; padding: 2px; }
.num {
padding: 10px 0; text-align: center; border: 1px solid var(--border); border-radius: 8px;
font-weight: 600; font-size: 13px; cursor: pointer; background: var(--input-bg); color: var(--text);
}
.num.taken { background: #27272a; color: #52525b; text-decoration: line-through; cursor: not-allowed; }
.num.selected { background: var(--green); color: white; border-color: var(--green); }
​.tablewrap { overflow-x: auto; margin-top: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { color: var(--muted); font-size: 11px; text-transform: uppercase; }
.hidden { display: none !important; }
.notice { font-size: 12px; color: var(--green); margin-bottom: 10px; font-weight: 600; display: none; }
.sync-status { font-size: 11px; color: var(--muted); text-align: right; margin-top: 6px; }
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>MCODS '25 Jersey Picker</h1>
<p>Select your number and size. Live synced for everyone.</p>
</header>
​<div class="tabs">
<button class="tab active" id="pickTab" onclick="switchTab('pick')">Pick / Edit</button>
<button class="tab" id="rosterTab" onclick="switchTab('roster')">Live Roster</button>
</div>
​<div id="pickSection">
<div class="jersey-preview">
<div class="jersey-svg-wrap">
<svg viewBox="0 0 200 170" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M60 15L35 35L15 65L45 80L55 55L55 155H145V55L155 80L185 65L165 35L140 15H115C115 25 85 25 85 15H60Z" fill="#dc2626"/>
<path d="M85 15C85 25 115 25 115 15H125L140 15L165 35L185 65L155 80L145 55V155H55V55L45 80L15 65L35 35L60 15H75C75 22 85 22 85 15Z" stroke="#f3f4f6" stroke-width="3" stroke-linejoin="round"/>
</svg>
</div>
<div class="preview-name" id="previewName">NAME</div>
<div class="preview-num" id="previewNum">00</div>
</div>
​<div class="card">
<div class="notice" id="editNotice">ℹ️ Existing registration found! Saving will update your choice.</div>
<div class="field">
<label>Your full name</label>
<input id="userName" placeholder="Enter your name" oninput="checkExistingUser()">
</div>
<div class="field">
<label>Serial no.</label>
<input id="serialNo" placeholder="e.g. 55">
</div>
<div class="field">
<label>Name on back</label>
<input id="nameOnBack" placeholder="e.g. GIRI" oninput="document.getElementById('previewName').textContent = this.value || 'NAME'">
</div>
<div class="field">
<label>Boys or Girls</label>
<div class="cat-grid">
<div class="cat-btn selected" id="btnBoys" onclick="setGender('Boys')">Boys</div>
<div class="cat-btn" id="btnGirls" onclick="setGender('Girls')">Girls</div>
</div>
</div>
<div class="field">
<label>Shirt size</label>
<div class="size-grid" id="sizeGrid">
<div class="size-pill" onclick="setSize('S')">S</div>
<div class="size-pill" onclick="setSize('M')">M</div>
<div class="size-pill" onclick="setSize('L')">L</div>
<div class="size-pill selected" onclick="setSize('XL')">XL</div>
<div class="size-pill" onclick="setSize('XXL')">XXL</div>
<div class="size-pill" onclick="setSize('XXXL')">3XL</div>
</div>
</div>
<div class="field">
<label>Jersey Number (00–99)</label>
<div class="numbers" id="numGrid"></div>
</div>
<button class="btn" onclick="saveSelection()">Save / Update selection</button>
<div class="sync-status" id="syncStatus">🔄 Syncing with cloud...</div>
</div>
</div>
​<div id="rosterSection" class="hidden">
<div class="card">
<h2>Registered Roster</h2>
<div class="tablewrap">
<table>
<thead><tr><th>Serial</th><th>No.</th><th>Name</th><th>Back</th><th>Size</th><th>Cat</th><th>Action</th></tr></thead>
<tbody id="rosterRows">
<tr><td colspan="7" style="text-align:center; color:var(--muted);">Loading live roster...</td></tr>
</tbody>
</table>
</div>
<button class="btn secondary" onclick="loadDataFromCloud()" style="margin-top:14px;">🔄 Refresh Roster</button>
</div>
</div>
</div>
​<script>
const BIN_ID = '6af1c19affd5d16053b373d3';
const API_KEY = '2a10$6l1h70b4HguEHUnxYngrW05DmXbwscL27.q/A6sylhNWpc.VLQ55oq';
​let selectedGender = 'Boys';
let selectedSize = 'XL';
let selectedNum = '';
let registrations = [];
​async function loadDataFromCloud(){
try {
const res = await fetch(https://api.jsonbin.io/v3/b/${BIN_ID}/latest, {
headers: { 'X-Master-Key': API_KEY }
});
const data = await res.json();
registrations = data.record.registrations || [];
renderNumbers();
renderRoster();
document.getElementById('syncStatus').textContent = '✅ Live synced with cloud';
} catch(e) {
document.getElementById('syncStatus').textContent = '⚠️ Offline / Sync error';
}
}
​async function saveDataToCloud(){
document.getElementById('syncStatus').textContent = '⏳ Saving to cloud...';
try {
await fetch(https://api.jsonbin.io/v3/b/${BIN_ID}, {
method: 'PUT',
headers: {
'Content-Type': 'application/json',
'X-Master-Key': API_KEY
},
body: JSON.stringify({ registrations })
});
document.getElementById('syncStatus').textContent = '✅ Live synced with cloud';
} catch(e) {
document.getElementById('syncStatus').textContent = '❌ Failed to save online';
}
}
​function switchTab(tab){
document.getElementById('pickSection').classList.toggle('hidden', tab !== 'pick');
document.getElementById('rosterSection').classList.toggle('hidden', tab !== 'roster');
document.getElementById('pickTab').classList.toggle('active', tab === 'pick');
document.getElementById('rosterTab').classList.toggle('active', tab === 'roster');
if(tab === 'roster') loadDataFromCloud();
}
​function setGender(g){
selectedGender = g;
document.getElementById('btnBoys').classList.toggle('selected', g === 'Boys');
document.getElementById('btnGirls').classList.toggle('selected', g === 'Girls');
renderNumbers();
}
​function setSize(s){
selectedSize = s;
document.querySelectorAll('.size-pill').forEach(el => {
el.classList.toggle('selected', el.textContent.replace('3XL','XXXL') === s || (s==='XXXL' && el.textContent==='3XL'));
});
}
​function checkExistingUser(){
const name = document.getElementById('userName').value.trim().toLowerCase();
const notice = document.getElementById('editNotice');
if(name.length < 2){ notice.style.display = 'none'; return; }
​const existing = registrations.find(r => r.name.toLowerCase() === name);
if(existing){
notice.style.display = 'block';
notice.textContent = ℹ️ Welcome back, ${existing.name}! Saving will update your entry.;
} else {
notice.style.display = 'none';
}
​const rawName = document.getElementById('userName').value.trim();
if(rawName && !document.getElementById('nameOnBack').value){
document.getElementById('previewName').textContent = rawName.split(' ')[0].toUpperCase();
}
}
​function renderNumbers(){
const grid = document.getElementById('numGrid');
grid.innerHTML = '';
const takenNums = new Set(registrations.filter(r => r.gender === selectedGender).map(r => r.num));
​for(let i = 0; i <= 99; i++){
const numStr = String(i).padStart(2, '0');
const div = document.createElement('div');
const isTaken = takenNums.has(numStr) && selectedNum !== numStr;
​div.className = 'num ' + (isTaken ? 'taken' : (selectedNum === numStr ? 'selected' : ''));
div.textContent = numStr;
​if(!isTaken){
div.onclick = () => {
selectedNum = numStr;
document.getElementById('previewNum').textContent = numStr;
renderNumbers();
};
}
grid.appendChild(div);
}
}
​async function saveSelection(){
const name = document.getElementById('userName').value.trim();
const serial = document.getElementById('serialNo').value.trim();
const backName = document.getElementById('nameOnBack').value.trim() || name;
if(!name || !selectedNum){
alert('Please fill in your name and select a jersey number.');
return;
}
​registrations = registrations.filter(r => r.name.toLowerCase() !== name.toLowerCase());
registrations.push({name, serial, backName, gender: selectedGender, size: selectedSize, num: selectedNum});
​await saveDataToCloud();
​alert('Jersey selection saved live!');
document.getElementById('userName').value = '';
document.getElementById('serialNo').value = '';
document.getElementById('nameOnBack').value = '';
selectedNum = '';
document.getElementById('previewNum').textContent = '00';
document.getElementById('previewName').textContent = 'NAME';
document.getElementById('editNotice').style.display = 'none';
renderNumbers();
renderRoster();
switchTab('roster');
}
​function renderRoster(){
const tbody = document.getElementById('rosterRows');
if(!registrations.length){
tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:var(--muted);">No one yet.</td></tr>';
return;
}
tbody.innerHTML = '';
registrations.forEach((r, idx) => {
const tr = document.createElement('tr');
tr.innerHTML = <td>${r.serial || '-'}</td><td><b>${r.num}</b></td><td>${r.name}</td><td>${r.backName}</td><td>${r.size}</td><td>${r.gender}</td><td><button class="btn danger" onclick="removeReg(${idx})">Release</button></td>;
tbody.appendChild(tr);
});
}
​async function removeReg(idx){
if(confirm('Are you sure you want to release this number?')){
registrations.splice(idx, 1);
await saveDataToCloud();
renderNumbers();
renderRoster();
}
}
​// Initial load and auto-sync check every 10 seconds
loadDataFromCloud();
setInterval(loadDataFromCloud, 10000);
</script>
</body>
</html>
