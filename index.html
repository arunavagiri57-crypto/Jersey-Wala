<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCODS '25 Jersey Picker</title>
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --input-bg: #2a2a2a;
      --border: #333333;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --blue: #3b82f6;
      --blue-hover: #2563eb;
      --green: #10b981;
      --red: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg);
      font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
    }
    .wrap { max-width: 480px; margin: 0 auto; padding: 16px 12px 40px; }
    header { margin-bottom: 16px; }
    h1 { font-size: 20px; margin: 0 0 4px; font-weight: 700; }
    header p { margin: 0; color: var(--muted); font-size: 13px; }

    .tabs { display: flex; gap: 8px; margin: 14px 0; background: var(--card-bg); padding: 4px; border-radius: 12px; border: 1px solid var(--border); }
    .tab { flex: 1; border: 0; background: transparent; padding: 10px; border-radius: 8px; font-weight: 600; color: var(--muted); cursor: pointer; text-align: center; font-size: 14px; }
    .tab.active { background: var(--blue); color: white; }

    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin: 12px 0; }
    h2 { font-size: 16px; margin: 0 0 10px; font-weight: 600; }
    
    label { display: block; font-weight: 600; font-size: 12px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; }
    input {
      width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px;
      background: var(--input-bg); font: inherit; color: var(--text); outline: none;
    }
    input:focus { border-color: var(--blue); }
    .field { margin-bottom: 14px; }
    
    .btn {
      background: var(--blue); color: white; border: 0; border-radius: 10px;
      padding: 13px 16px; font-weight: 600; font-size: 14px; cursor: pointer; width: 100%;
      text-align: center; margin-top: 6px;
    }
    .btn:hover { background: var(--blue-hover); }
    .btn.danger { background: rgba(239, 68, 68, 0.15); color: var(--red); width: auto; padding: 6px 12px; font-size: 12px; }

    .jersey-preview {
      background: linear-gradient(145deg, #18181b, #09090b);
      border: 1px solid var(--border); border-radius: 12px; padding: 16px; text-align: center; margin-bottom: 16px;
    }
    .jersey-svg-wrap { width: 130px; margin: 0 auto 8px; }
    .jersey-svg-wrap svg { width: 100%; height: auto; display: block; }
    .preview-name { font-size: 12px; font-weight: 700; letter-spacing: 1.5px; color: white; text-transform: uppercase; margin-bottom: 2px; }
    .preview-num { font-size: 32px; font-weight: 900; color: white; line-height: 1; }

    .size-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
    .size-pill {
      background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 0; text-align: center; font-weight: 600; font-size: 13px; cursor: pointer; color: var(--text);
    }
    .size-pill.selected { background: var(--blue); border-color: var(--blue); color: white; }

    .cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .cat-btn {
      background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px;
      padding: 10px; text-align: center; font-weight: 600; cursor: pointer; color: var(--muted);
    }
    .cat-btn.selected { background: var(--blue); border-color: var(--blue); color: white; }

    .numbers { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; max-height: 280px; overflow-y: auto; padding: 2px; }
    .num {
      padding: 10px 0; text-align: center; border: 1px solid var(--border); border-radius: 8px;
      font-weight: 600; font-size: 13px; cursor: pointer; background: var(--input-bg); color: var(--text);
    }
    .num.taken { background: #27272a; color: #52525b; text-decoration: line-through; cursor: not-allowed; }
    .num.selected { background: var(--green); color: white; border-color: var(--green); }
